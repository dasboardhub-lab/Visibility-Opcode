<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opcode Analytics</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' },
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(59, 130, 246, 0.15)',
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02)',
                    }
                }
            }
        }
    </script>
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        
        /* Premium Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; border: 2px solid transparent; background-clip: content-box; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Toast */
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast-enter { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Spinner */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- FIREBASE SETUP -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyBBlbxiBpBR522JTI5xyxakGK9AEChXv1o",
            authDomain: "dailyreport-cfc8f.firebaseapp.com",
            projectId: "dailyreport-cfc8f",
            storageBucket: "dailyreport-cfc8f.firebasestorage.app",
            messagingSenderId: "963104518926",
            appId: "1:963104518926:web:c6f106b193b504058c5d5f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'opcode-dashboard-persistent-v1'; // Locked ID

        window.fbAuth = auth;
        window.fbDb = db;
        window.fbAppId = appId;
        window.fbSignInAnonymously = signInAnonymously;
        window.fbSignInWithCustomToken = signInWithCustomToken;
        window.fbOnAuthStateChanged = onAuthStateChanged;
        window.fbCollection = collection;
        window.fbDoc = doc;
        window.fbSetDoc = setDoc;
        window.fbOnSnapshot = onSnapshot;
        window.initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICONS ---
        const Icons = {
            Upload: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
            Calendar: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            Cloud: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19c0-3.037-2.463-5.5-5.5-5.5S6.5 15.963 6.5 19H5a3 3 0 0 1 0-6h.5a4.5 4.5 0 1 1 8.567-2.073A5.502 5.502 0 0 1 18 13.5v.5a3 3 0 0 1 0 6h-2.5z"/></svg>,
            X: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            CheckCircle: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>,
            AlertTriangle: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>,
            Activity: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,
            Truck: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>,
            Home: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
            MapPin: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>,
            Filter: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>,
            Info: ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        };

        // --- COMPONENTS ---
        const Badge = ({ value, isReference }) => {
            if (value === "-") return <span className="text-slate-300 font-light text-[10px]">-</span>;
            
            if (isReference) {
                return (
                    <div className="inline-flex items-center justify-center px-2.5 py-1 rounded-md text-[11px] font-bold bg-slate-900 text-white border border-slate-700 shadow-sm min-w-[52px]">
                        {value}
                    </div>
                );
            }

            const num = parseFloat(value);
            let bgClass = "bg-slate-50 text-slate-500 border-slate-200", dotClass = "bg-slate-400";
            if (num >= 98) { bgClass = "bg-emerald-50 text-emerald-700 border-emerald-200"; dotClass = "bg-emerald-500"; } 
            else if (num < 95) { bgClass = "bg-rose-50 text-rose-700 border-rose-200"; dotClass = "bg-rose-500"; } 
            else { bgClass = "bg-amber-50 text-amber-700 border-amber-200"; dotClass = "bg-amber-500"; }
            
            return (
                <div className={`inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-semibold border ${bgClass}`}>
                    <span className={`w-1.5 h-1.5 rounded-full mr-1.5 ${dotClass}`}></span>{value}
                </div>
            );
        };

        const KPICard = ({ title, value, icon: Icon, color }) => {
            const colors = { blue: "from-blue-500 to-blue-600", indigo: "from-indigo-500 to-indigo-600", emerald: "from-emerald-500 to-emerald-600", purple: "from-purple-500 to-purple-600" };
            const shadow = { blue: "shadow-blue-500/20", indigo: "shadow-indigo-500/20", emerald: "shadow-emerald-500/20", purple: "shadow-purple-500/20" };
            return (
                <div className="bg-white rounded-2xl p-5 shadow-card hover:shadow-lg transition-all duration-300 border border-slate-100 group relative overflow-hidden">
                    <div className="flex items-start justify-between relative z-10">
                        <div><p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">{title}</p><h3 className="text-2xl font-bold text-slate-800 tracking-tight">{value}</h3></div>
                        <div className={`p-3 rounded-xl shadow-lg text-white bg-gradient-to-br ${colors[color]} ${shadow[color]} transform group-hover:scale-110 transition-transform duration-300`}><Icon className="w-5 h-5" /></div>
                    </div>
                </div>
            );
        };

        const ToastNotification = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(() => onClose(), 5000); return () => clearTimeout(timer); }, [onClose]);
            const styles = { success: "bg-white border-l-4 border-emerald-500 text-slate-800 shadow-xl shadow-emerald-500/10", error: "bg-white border-l-4 border-rose-500 text-slate-800 shadow-xl shadow-rose-500/10", info: "bg-white border-l-4 border-blue-500 text-slate-800 shadow-xl shadow-blue-500/10" };
            const Icon = type === 'success' ? Icons.CheckCircle : (type === 'error' ? Icons.AlertTriangle : Icons.Info);
            const iconColor = type === 'success' ? 'text-emerald-500' : (type === 'error' ? 'text-rose-500' : 'text-blue-500');
            return (
                <div className={`fixed top-24 right-6 z-50 flex items-center p-4 rounded-xl animate-toast max-w-sm w-full ${styles[type]} ring-1 ring-slate-100`}>
                    <Icon className={`w-5 h-5 flex-shrink-0 mr-3 ${iconColor}`} /><div className="flex-1 text-sm font-medium">{message}</div>
                    <button onClick={onClose} className="ml-2 text-slate-400 hover:text-slate-600 transition-colors"><Icons.X className="w-4 h-4" /></button>
                </div>
            );
        };

        const TrendChart = ({ data, mode, onToggle }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);
            useEffect(() => {
                if (!canvasRef.current || !data) return;
                const ctx = canvasRef.current.getContext('2d');
                if (chartRef.current) chartRef.current.destroy();
                const valueOnPointsPlugin = {
                    id: 'valueOnPoints',
                    afterDatasetsDraw(chart) {
                        const { ctx } = chart;
                        chart.data.datasets.forEach((dataset, i) => {
                            const meta = chart.getDatasetMeta(i);
                            if (!meta.hidden) {
                                meta.data.forEach((element, index) => {
                                    const value = dataset.data[index];
                                    if (value !== null && value !== undefined && value > 0) {
                                        const text = value.toFixed(1) + '%';
                                        ctx.font = 'bold 10px Inter';
                                        const textWidth = ctx.measureText(text).width;
                                        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                                        ctx.shadowColor = 'rgba(0,0,0,0.1)'; ctx.shadowBlur = 4;
                                        ctx.fillRect(element.x - textWidth/2 - 4, element.y - 26, textWidth + 8, 18);
                                        ctx.shadowBlur = 0;
                                        ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                                        ctx.fillText(text, element.x, element.y - 17);
                                    }
                                });
                            }
                        });
                    }
                };
                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: { labels: data.labels, datasets: data.datasets },
                    options: {
                        responsive: true, maintainAspectRatio: false, 
                        layout: { padding: { top: 30, right: 15, left: 5, bottom: 5 } },
                        interaction: { mode: 'index', intersect: false },
                        plugins: { legend: { display: false }, tooltip: { enabled: false } }, 
                        scales: { 
                            x: { grid: { display: false }, ticks: { color: '#64748b', font: {size: 11}, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } }, 
                            y: { display: false, min: 0, max: 120 } 
                        },
                        elements: { line: { tension: 0.4 } }
                    },
                    plugins: [valueOnPointsPlugin] 
                });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data]);
            return (
                <div className="bg-white p-6 rounded-2xl shadow-card border border-slate-100 h-full flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-50 p-2 rounded-lg"><Icons.Activity className="w-5 h-5 text-blue-600" /></div>
                            <div><h4 className="text-sm font-bold text-slate-800">Trend Visibility</h4><p className="text-xs text-slate-400 font-medium mt-0.5">Total Average per {mode === 'daily' ? 'Day' : 'Month'}</p></div>
                        </div>
                        <div className="flex bg-slate-50 rounded-lg p-1 border border-slate-100">
                            <button onClick={() => onToggle('daily')} className={`px-3 py-1.5 text-[11px] font-bold rounded-md transition-all duration-200 ${mode === 'daily' ? 'bg-white text-blue-600 shadow-sm ring-1 ring-black/5' : 'text-slate-500 hover:text-slate-700'}`}>Daily</button>
                            <button onClick={() => onToggle('monthly')} className={`px-3 py-1.5 text-[11px] font-bold rounded-md transition-all duration-200 ${mode === 'monthly' ? 'bg-white text-blue-600 shadow-sm ring-1 ring-black/5' : 'text-slate-500 hover:text-slate-700'}`}>Monthly</button>
                        </div>
                    </div>
                    <div className="flex-1 relative w-full h-full overflow-hidden"><canvas ref={canvasRef}></canvas></div>
                </div>
            );
        };

        const ProgressSummary = ({ data }) => {
            if (!data) return null;
            return (
                <div className="bg-white p-6 rounded-2xl shadow-card border border-slate-100 h-full flex flex-col">
                    <div className="mb-5 flex items-center gap-3">
                        <div className="bg-purple-50 p-2 rounded-lg"><Icons.Activity className="w-5 h-5 text-purple-600" /></div>
                        <div><h4 className="text-sm font-bold text-slate-800">Opcode Summary</h4><p className="text-xs text-slate-400 font-medium mt-0.5">Performance Breakdown</p></div>
                    </div>
                    <div className="flex-1 flex flex-col justify-between min-h-0 space-y-3">
                        {data.labels.map((label, idx) => {
                            const value = data.values[idx]; const color = data.colors[idx];
                            return (
                                <div key={idx} className="group w-full">
                                    <div className="flex justify-between items-end mb-2"><span className="text-[11px] font-bold text-slate-500 group-hover:text-slate-800 transition-colors uppercase tracking-wide">{label}</span><span className="text-xs font-bold text-slate-700">{value.toFixed(1)}%</span></div>
                                    <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden ring-1 ring-slate-100"><div className="h-full rounded-full transition-all duration-1000 ease-out shadow-sm relative group-hover:opacity-90" style={{ width: `${Math.min(value, 100)}%`, backgroundColor: color }}></div></div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const PerformanceTable = ({ title, data, labelColName, colorScheme = "blue" }) => {
            if (!data) return null;
            const accents = { blue: "text-blue-700 border-blue-100 bg-blue-50/50", indigo: "text-indigo-700 border-indigo-100 bg-indigo-50/50", emerald: "text-emerald-700 border-emerald-100 bg-emerald-50/50", purple: "text-purple-700 border-purple-100 bg-purple-50/50" };
            const Icon = title.includes("Inbound") ? Icons.Truck : (title.includes("Outbound") ? Icons.Cloud : (title.includes("Intra") ? Icons.Home : Icons.Activity));
            return (
                <div className="h-full flex flex-col animate-fade-in bg-white rounded-2xl shadow-card border border-slate-200 overflow-hidden hover:shadow-lg transition-shadow duration-300">
                    <div className={`px-5 py-4 border-b flex items-center gap-3 ${accents[colorScheme]}`}><Icon className={`w-4 h-4 opacity-80`} /><h3 className="text-xs font-extrabold uppercase tracking-widest">{title}</h3></div>
                    <div className="flex-1 overflow-auto custom-scroll">
                        <table className="w-full text-xs text-slate-700">
                            <thead>
                                <tr className="bg-white border-b border-slate-100 shadow-sm">
                                    <th className="px-3 py-2.5 text-left font-bold text-slate-400 uppercase tracking-wider sticky left-0 z-10 bg-white border-r border-slate-100">{labelColName}</th>
                                    {data.hubs.map(hub => <th key={hub} className={`px-3 py-2.5 text-center font-bold text-slate-400 uppercase tracking-wider min-w-[60px] ${hub === 'TOTAL' ? 'bg-slate-50/80' : ''}`}>{hub}</th>)}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-50">
                                {data.metrics.map((metric, idx) => {
                                    const isAvgRow = metric.label === "TOTAL AVERAGE";
                                    const rowClass = isAvgRow ? "bg-slate-50/80 font-bold" : "hover:bg-slate-50/60 transition-colors";
                                    const isRef = metric.isReference;
                                    const labelClass = isRef ? "bg-slate-800 text-white font-bold shadow-md" : "font-semibold text-slate-600 bg-white";
                                    return (
                                        <tr key={idx} className={rowClass}>
                                            <td className={`px-3 py-3 sticky left-0 z-10 border-r border-slate-100 ${labelClass} ${isAvgRow ? '!bg-slate-50 !text-slate-800' : ''}`}>{metric.label}</td>
                                            {data.hubs.map(hub => {
                                                const hubData = data.grouped[hub] || {};
                                                const isTotalCol = hub === 'TOTAL';
                                                let content = null;
                                                if (metric.isSum) { content = <span className="font-bold text-slate-700 font-mono tracking-tight">{(hubData[metric.key] || 0).toLocaleString('id-ID')}</span>; } 
                                                else {
                                                    let num = 0, den = 0;
                                                    if (typeof metric.calc === 'function') { const res = metric.calc(hubData); num = res.num; den = res.den; } 
                                                    else { num = hubData[metric.keyNum] || 0; den = hubData[metric.keyDen] || 0; }
                                                    if (den > 0) { const pct = ((num / den) * 100).toFixed(1) + "%"; content = <Badge value={pct} isReference={isRef} />; } 
                                                    else { content = <span className="text-slate-300">-</span>; }
                                                }
                                                return <td key={hub} className={`px-3 py-2 text-center ${isTotalCol ? 'bg-slate-50/40' : ''} ${isAvgRow ? '!bg-slate-100' : ''}`}>{content}</td>;
                                            })}
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [rawData, setRawData] = useState([]);
            const [filteredData, setFilteredData] = useState([]);
            const [user, setUser] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const [isFetching, setIsFetching] = useState(true); 
            const [notification, setNotification] = useState(null);
            const [startDate, setStartDate] = useState("");
            const [endDate, setEndDate] = useState("");
            const [selectedHub, setSelectedHub] = useState("All");
            const [chartMode, setChartMode] = useState("daily");

            const showNotification = (message, type = 'info') => setNotification({ message, type });

            // Auth & Fetch
            useEffect(() => {
                const init = async () => {
                    const auth = window.fbAuth;
                    if (window.initialAuthToken) await window.fbSignInWithCustomToken(auth, window.initialAuthToken).catch(console.error);
                    else await window.fbSignInAnonymously(auth).catch(console.error);
                };
                const unsub = window.fbOnAuthStateChanged(window.fbAuth, u => {
                    setUser(u);
                    if (u) {
                        setIsFetching(true);
                        const unsubSnap = window.fbOnSnapshot(window.fbCollection(window.fbDb, 'artifacts', window.fbAppId, 'users', u.uid, 'daily_data'), s => {
                            let rows = []; s.forEach(d => { if (d.data().rows) rows.push(...d.data().rows); });
                            if (rows.length) {
                                rows.sort((a,b) => a.date.localeCompare(b.date)); setRawData(rows);
                                const d = [...new Set(rows.map(x=>x.date))].sort(); 
                                setStartDate(prev=>prev||d[0]); setEndDate(prev=>prev||d[d.length-1]);
                            } else setRawData([]);
                            setIsFetching(false);
                        }, e => { console.error(e); showNotification("Sync Error: " + e.message, "error"); setIsFetching(false); });
                        return () => unsubSnap();
                    }
                });
                init();
                return () => unsub();
            }, []);

            const isDateExist = (dateStr) => rawData.some(row => row.date === dateStr);

            const handleUpload = async (raw) => {
                if(!user) return showNotification("Menunggu koneksi database...", "error");
                setIsUploading(true);
                try {
                    let hIdx = -1; for(let i=0; i<Math.min(raw.length,20); i++) if(raw[i].map(x=>String(x).toLowerCase().trim()).includes('pickup_hub')) { hIdx=i; break; }
                    if(hIdx===-1) throw new Error("Format header salah. Pastikan ada pickup_hub & delivery_hub");
                    const head = raw[hIdx].map(x=>String(x).trim());
                    const objs = raw.slice(hIdx+1).map(r => { const o={}; head.forEach((h,i)=>o[h]=r[i]); return o; });
                    let dKey = null; const proc = [];
                    objs.forEach(r => { 
                        if(!dKey) { const ks=Object.keys(r); dKey=ks.find(x=>x.toLowerCase().includes('80_dt'))||ks.find(x=>x.toLowerCase().includes('date')); }
                        let dateStr = "Unknown";
                        if(dKey && r[dKey]) {
                            const v = r[dKey]; 
                            if(typeof v==='number') { const dt=new Date((v-25569)*864e5); if(!isNaN(dt)) dateStr=dt.toISOString().split('T')[0]; }
                            else dateStr=String(v).trim().substring(0,10);
                        }
                        const get = k => r[Object.keys(r).find(x=>x.toLowerCase().trim()===k.toLowerCase())];
                        const get31 = () => { let k = Object.keys(r).find(x => x.toLowerCase().includes('31') && x.toLowerCase().includes('delivery')); if (!k) k = Object.keys(r).find(x => x.trim() === '31'); return k ? parseInt(r[k] || 0, 10) : 0; };
                        const p = String(get('pickup_hub')||"").trim().toUpperCase(), d = String(get('delivery_hub')||"").trim().toUpperCase();
                        
                        // NEW COLUMNS LOGIC
                        const platform = String(get('platform')||"").trim();
                        const service = String(get('Service')||"").trim();

                        if(p && d) {
                            const num = k => { let v=get(k); if(v===undefined)v=r[k]; return parseInt(v||0,10); };
                            proc.push({
                                date: dateStr, pickup_hub:p, delivery_hub:d, isGateway:p!==d, 
                                platform, service, // Added here
                                val_80:num('80'), val_407:num('407'), val_43:num('43'), val_643:num('643'), 
                                val_82:num('82'), val_83:num('83'), val_41:num('41'), val_31:get31(), 
                                val_603:num('603'), val_618:num('618'), val_640:num('640')
                            });
                        }
                    });
                    if(!proc.length) throw new Error("Data valid tidak ditemukan.");
                    const uploadDates = [...new Set(proc.map(r => r.date))];
                    const duplicates = uploadDates.filter(d => isDateExist(d));
                    if (duplicates.length > 0) throw new Error(`Upload Dibatalkan: Data tanggal ${duplicates.join(', ')} sudah ada.`);
                    const grp = {}; proc.forEach(r=>{ if(!grp[r.date])grp[r.date]=[]; grp[r.date].push(r); });
                    await Promise.all(Object.keys(grp).map(k=>window.fbSetDoc(window.fbDoc(window.fbDb,'artifacts',window.fbAppId,'users',user.uid,'daily_data',k),{date:k,rows:grp[k]},{merge:true})));
                    showNotification("Upload Berhasil! Data baru tersimpan.", "success");
                    const dates=Object.keys(grp).sort(); if(!startDate)setStartDate(dates[0]); if(!endDate)setEndDate(dates[dates.length-1]);
                } catch(e) { console.error(e); showNotification(e.message, "error"); } finally { setIsUploading(false); }
            };

            useEffect(() => { 
                if(rawData.length) {
                    const dts = rawData.map(d=>d.date).sort();
                    const s = startDate || dts[0];
                    const e = endDate || dts[dts.length-1];
                    setFilteredData(rawData.filter(d => (!d.date || d.date==="Unknown") ? true : (d.date >= s && d.date <= e))); 
                }
            }, [startDate, endDate, rawData]);

            // Aggregation Helpers
            const prepTbl = (ds, f, flt) => {
                if(!ds.length) return null; const hs = selectedHub==="All"?['MKS','BPP','BJM','MND','PLK']: [selectedHub]; const g={}; [...hs,'TOTAL'].forEach(h=>g[h]={v80:0,v643:0,v82:0,v83:0,v41:0,v31:0,v603:0,v618:0,v640:0,v407:0,v43:0});
                ds.forEach(r=>{ if(flt&&!flt(r))return; if(hs.includes(r[f])){ const h=g[r[f]],t=g['TOTAL']; ['v80','v643','v82','v83','v41','v31','v603','v618','v640','v407','v43'].forEach(k=>{const v=r['val_'+k.substring(1)];h[k]+=v;t[k]+=v}); } });
                return { hubs:[...hs,'TOTAL'], grouped:g };
            };
            const sumLog = (ds) => {
                const hs = selectedHub==="All"?['MKS','BPP','BJM','MND','PLK']: [selectedHub]; const g={}; [...hs,'TOTAL'].forEach(h=>g[h]={inbound:{v80:0,v603:0,v618:0,v640:0,v83:0,v41:0,v82:0},outbound:{v80:0,v407:0,v43:0,v603:0,v618:0,v643:0,v82:0},intra:{v80:0,v407:0,v43:0,v603:0,v618:0,v640:0}});
                ds.forEach(r=>{ const add=(h,t,ks)=>{if(hs.includes(h))ks.forEach(k=>{const v=r['val_'+k.substring(1)];g[h][t][k]+=v;g['TOTAL'][t][k]+=v})}; if(r.isGateway){add(r.pickup_hub,'outbound',['v80','v407','v43','v603','v618','v643','v82']);add(r.delivery_hub,'inbound',['v80','v603','v618','v640','v83','v41','v82'])}else add(r.pickup_hub,'intra',['v80','v407','v43','v603','v618','v640'])});
                return g;
            };
            const sumMets = [ { label: "Aver % 407", color: '#ef4444', calc: d => ({ num: d.outbound.v407+d.intra.v407, den: d.outbound.v80+d.intra.v80 }) }, { label: "Aver % 43", color: '#f97316', calc: d => ({ num: d.outbound.v43+d.intra.v43, den: d.outbound.v80+d.intra.v80 }) }, { label: "Aver % 603", color: '#eab308', calc: d => ({ num: d.inbound.v603+d.outbound.v603+d.intra.v603, den: d.inbound.v80+d.outbound.v80+d.intra.v80 }) }, { label: "Aver % 618", color: '#84cc16', calc: d => ({ num: d.inbound.v618+d.outbound.v618+d.intra.v618, den: d.inbound.v80+d.outbound.v80+d.intra.v80 }) }, { label: "Aver % 640", color: '#10b981', calc: d => ({ num: d.inbound.v640+d.intra.v640, den: d.inbound.v80+d.intra.v80 }) }, { label: "Aver % 643", color: '#06b6d4', calc: d => ({ num: d.outbound.v643, den: d.outbound.v80 }) }, { label: "Aver % 82", color: '#3b82f6', calc: d => ({ num: d.outbound.v82, den: d.outbound.v643 }) }, { label: "Aver % 83", color: '#6366f1', calc: d => ({ num: d.inbound.v83, den: d.inbound.v82 }) }, { label: "Aver % 41", color: '#8b5cf6', calc: d => ({ num: d.inbound.v41, den: d.inbound.v82 }) }, { label: "TOTAL AVERAGE", color: '#1e293b', calc: d => { const p = (n, de) => de > 0 ? n/de : 0; const vs=[p(d.outbound.v407+d.intra.v407,d.outbound.v80+d.intra.v80),p(d.outbound.v43+d.intra.v43,d.outbound.v80+d.intra.v80),p(d.inbound.v603+d.outbound.v603+d.intra.v603,d.inbound.v80+d.outbound.v80+d.intra.v80),p(d.inbound.v618+d.outbound.v618+d.intra.v618,d.inbound.v80+d.outbound.v80+d.intra.v80),p(d.inbound.v640+d.intra.v640,d.inbound.v80+d.intra.v80),p(d.outbound.v643,d.outbound.v80),p(d.outbound.v82,d.outbound.v643),p(d.inbound.v83,d.inbound.v82),p(d.inbound.v41,d.inbound.v82)]; return { num: vs.reduce((a,c)=>a+c,0)/9, den: 1 }; } } ];
            
            const inData = useMemo(() => { const b=prepTbl(filteredData,'delivery_hub',r=>r.isGateway); if(!b)return null; b.metrics=[{ label: "Aver % 643", keyNum: 'v643', keyDen: 'v80', isReference: true }, { label: "Aver % 82", keyNum: 'v82', keyDen: 'v643', isReference: true }, { label: "Aver % 83", keyNum: 'v83', keyDen: 'v82' }, { label: "Aver % 41", keyNum: 'v41', keyDen: 'v82' }, { label: "Aver % 603", keyNum: 'v603', keyDen: 'v80' }, { label: "Aver % 618", keyNum: 'v618', keyDen: 'v80' }, { label: "Aver % 640", keyNum: 'v640', keyDen: 'v80' }, { label: "SUM of 80", isSum: true, key: 'v80' }]; return b; }, [filteredData, selectedHub]);
            const outData = useMemo(() => { const b=prepTbl(filteredData,'pickup_hub',r=>r.isGateway); if(!b)return null; b.metrics=[{ label: "Aver % 407", keyNum: 'v407', keyDen: 'v80', isReference: true }, { label: "Aver % 43", keyNum: 'v43', keyDen: 'v80' }, { label: "Aver % 603", keyNum: 'v603', keyDen: 'v80' }, { label: "Aver % 618", keyNum: 'v618', keyDen: 'v80' }, { label: "Aver % 643", keyNum: 'v643', keyDen: 'v80' }, { label: "Aver % 82", keyNum: 'v82', keyDen: 'v643' }, { label: "SUM of 80", isSum: true, key: 'v80' }]; return b; }, [filteredData, selectedHub]);
            const intData = useMemo(() => { const b=prepTbl(filteredData,'pickup_hub',r=>!r.isGateway); if(!b)return null; b.metrics=[{ label: "Aver % 407", keyNum: 'v407', keyDen: 'v80', isReference: true }, { label: "Aver % 43", keyNum: 'v43', keyDen: 'v80' }, { label: "Aver % 603", keyNum: 'v603', keyDen: 'v80' }, { label: "Aver % 618", keyNum: 'v618', keyDen: 'v80' }, { label: "Aver % 640", keyNum: 'v640', keyDen: 'v80' }, { label: "SUM of 80", isSum: true, key: 'v80' }]; return b; }, [filteredData, selectedHub]);
            
            const sumData = useMemo(() => { if(!filteredData.length)return null; const hs=selectedHub==="All"?['MKS','BPP','BJM','MND','PLK']:[selectedHub]; return { hubs:hs, grouped:sumLog(filteredData), metrics:sumMets }; }, [filteredData, selectedHub]);
            const kpi = useMemo(() => { if(!sumData)return null; const t=sumLog(filteredData)['TOTAL'], c=l=>{const m=sumMets.find(x=>x.label===l);if(!m)return"0.0%";const r=m.calc(t);return r.den>0?((r.num/r.den)*100).toFixed(1)+"%":"0.0%"}; return { tot:c("TOTAL AVERAGE"), in:c("Aver % 643"), out:c("Aver % 407"), intra:c("Aver % 640") }; }, [filteredData]);
            
            const chart = useMemo(() => { 
                if(!filteredData.length)return{t:null,b:null}; 
                let labels = [], tDs={label:'Total Avg',borderColor:'#3b82f6',backgroundColor:'#3b82f6',tension:0.3,pointRadius:3,borderWidth:3,fill:false,data:[]};
                const tAvg=sumMets.find(x=>x.label==="TOTAL AVERAGE");
                if (chartMode==='daily') {
                    const dts=[...new Set(filteredData.map(d=>d.date))].sort(); labels=dts;
                    dts.forEach(d=>{ const g=sumLog(filteredData.filter(x=>x.date===d)); tDs.data.push(tAvg.calc(g['TOTAL']).den>0?(tAvg.calc(g['TOTAL']).num/tAvg.calc(g['TOTAL']).den)*100:0); });
                } else {
                    if (rawData.length > 0) {
                        const allDates = rawData.map(d=>d.date).sort();
                        const latestYear = new Date(allDates[allDates.length-1]).getFullYear();
                        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                        const yearData = rawData.filter(d => new Date(d.date).getFullYear() === latestYear);
                        const mGrps = {}; yearData.forEach(r => { const m = new Date(r.date).getMonth(); if(!mGrps[m]) mGrps[m]=[]; mGrps[m].push(r); });
                        Object.keys(mGrps).sort((a,b)=>a-b).forEach(m => { labels.push(months[m]); tDs.data.push(tAvg.calc(sumLog(mGrps[m])['TOTAL']).den>0?(tAvg.calc(sumLog(mGrps[m])['TOTAL']).num/tAvg.calc(sumLog(mGrps[m])['TOTAL']).den)*100:0); });
                    }
                }
                const totG=sumLog(filteredData)['TOTAL']; const opMetrics = sumMets.filter(x => x.label !== "TOTAL AVERAGE" && x.label !== "Aver % 407"); const b={labels:[],values:[],colors:[]}; 
                opMetrics.forEach(m=>{ b.labels.push(m.label.replace('Aver % ','')); const r=m.calc(totG); const v=r.den>0?(r.num/r.den)*100:0; b.values.push(v); let c='#d97706'; if(v>=98)c='#059669'; else if(v<95)c='#e11d48'; b.colors.push(c); });
                return { t:{labels,datasets:[tDs]}, b }; 
            }, [filteredData, rawData, selectedHub, chartMode]);

            return (
                <div className="min-h-screen pb-10">
                    {notification && <ToastNotification message={notification.message} type={notification.type} onClose={() => setNotification(null)} />}
                    <div className="sticky top-0 z-50 w-full bg-slate-900/90 backdrop-blur-md shadow-lg border-b border-slate-800 transition-all duration-300">
                        <div className="w-full px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3 group"><div className="bg-gradient-to-br from-brand-500 to-brand-700 p-2 rounded-xl shadow-glow transition-all group-hover:scale-105"><Icons.Activity className="w-5 h-5 text-white" /></div><div><h1 className="text-lg font-bold text-white tracking-tight leading-tight">Executive Dashboard</h1><p className="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Opcode Analytics</p></div></div>
                            <div className="flex items-center gap-4">
                                {user ? ( <div className="hidden md:flex items-center gap-2 text-xs font-semibold text-emerald-400 bg-emerald-400/10 px-3 py-1.5 rounded-full border border-emerald-400/20 shadow-sm"><div className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></div>System Online</div> ) : ( <div className="flex items-center gap-2 text-xs text-slate-500"><div className="spinner border-slate-500 border-t-transparent w-3 h-3"></div> Connecting...</div> )}
                                <label className={`cursor-pointer group flex items-center gap-2 bg-slate-800 hover:bg-brand-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all duration-300 shadow-lg hover:shadow-brand-500/25 border border-slate-700 hover:border-brand-500 ${isUploading ? 'opacity-50 cursor-wait' : ''}`}>
                                    {isUploading ? (<div className="spinner !w-3 !h-3 !border-white/30 !border-t-white mr-1"></div>) : (<Icons.Upload className="w-4 h-4 text-slate-400 group-hover:text-white transition-colors" />)}
                                    {isUploading ? 'Syncing...' : 'Upload Data'}
                                    <input type="file" accept=".csv, .xlsx, .xls" className="hidden" onChange={(e) => { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=(ev)=>{ const b=ev.target.result; try{ if(f.name.endsWith('.csv')) Papa.parse(f,{header:false,skipEmptyLines:true,complete:x=>handleUpload(x.data)}); else handleUpload(XLSX.utils.sheet_to_json(XLSX.read(b,{type:'binary'}).Sheets[XLSX.read(b,{type:'binary'}).SheetNames[0]],{header:1,defval:""})); }catch(z){showNotification("File Error","error")} }; if(f.name.endsWith('.csv')) Papa.parse(f,{header:false,skipEmptyLines:true,complete:x=>handleUpload(x.data)}); else r.readAsBinaryString(f); }} disabled={isUploading} />
                                </label>
                            </div>
                        </div>
                    </div>

                    <div className="w-full px-6 lg:px-8 py-8 space-y-8">
                        {rawData.length > 0 && (
                            <div className="bg-white/80 backdrop-blur-xl p-1.5 rounded-2xl border border-white shadow-soft flex flex-col md:flex-row items-center justify-between gap-4 animate-fade-in sticky top-20 z-40 ring-1 ring-slate-900/5">
                                <div className="flex flex-wrap items-center gap-2 w-full md:w-auto p-2">
                                    <div className="flex items-center gap-3 bg-slate-50/80 px-4 py-2 rounded-xl border border-slate-200/60 shadow-sm transition-all hover:bg-white hover:shadow-md">
                                        <div className="text-slate-400"><Icons.Calendar className="w-4 h-4" /></div>
                                        <div className="flex items-center gap-3 text-xs font-semibold text-slate-700">
                                            <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="bg-transparent border-none focus:ring-0 p-0 cursor-pointer" />
                                            <span className="text-slate-300 font-light">to</span>
                                            <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="bg-transparent border-none focus:ring-0 p-0 cursor-pointer" />
                                        </div>
                                    </div>
                                    <div className="h-8 w-px bg-slate-200 hidden md:block mx-2"></div>
                                    <div className="relative group">
                                        <select value={selectedHub} onChange={(e) => setSelectedHub(e.target.value)} className="appearance-none bg-slate-50/80 hover:bg-white border border-slate-200/60 text-slate-700 text-xs font-bold rounded-xl pl-4 pr-10 py-2.5 focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 cursor-pointer transition-all shadow-sm hover:shadow-md">
                                            <option value="All">All Hubs</option><option value="MKS">MKS</option><option value="BPP">BPP</option><option value="BJM">BJM</option><option value="MND">MND</option><option value="PLK">PLK</option>
                                        </select>
                                        <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 group-hover:text-brand-500 transition-colors"><Icons.Filter className="w-3.5 h-3.5" /></div>
                                    </div>
                                </div>
                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-4 flex items-center gap-2"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>Live Sync</div>
                            </div>
                        )}

                        {kpi && ( <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 animate-fade-in" style={{animationDelay: '100ms'}}> <KPICard title="Total Visibility" value={kpi.tot} icon={Icons.Activity} color="indigo" /> <KPICard title="Inbound (Arr Scn)" value={kpi.in} icon={Icons.Truck} color="blue" /> <KPICard title="Outbound (Pup Scn)" value={kpi.out} icon={Icons.Cloud} color="purple" /> <KPICard title="Intra City (Dlv Scn)" value={kpi.intra} icon={Icons.Home} color="emerald" /> </div> )}

                        {chart.t && (
                            <div className="space-y-6 animate-fade-in" style={{animationDelay: '200ms'}}>
                                <div className="w-full h-[340px]"><TrendChart data={chart.t} mode={chartMode} onToggle={setChartMode} /></div>
                                <div className="grid grid-cols-1 lg:grid-cols-10 gap-6">
                                    <div className="lg:col-span-7 h-full"><PerformanceTable title="Rekapan Opcode (Summary)" data={sumData} labelColName="Metric / Hub" colorScheme="purple" /></div>
                                    <div className="lg:col-span-3 h-full"><ProgressSummary data={chart.b} /></div>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="h-[500px]"><PerformanceTable title="Inbound Gateway" data={inData} labelColName="Metric" colorScheme="blue" /></div>
                                    <div className="h-[500px]"><PerformanceTable title="Outbound Gateway" data={outData} labelColName="Metric" colorScheme="indigo" /></div>
                                    <div className="h-[500px]"><PerformanceTable title="Intra City" data={intData} labelColName="Metric" colorScheme="emerald" /></div>
                                </div>
                            </div>
                        )}

                        {rawData.length === 0 && (
                            <div className="flex flex-col items-center justify-center py-32 bg-white rounded-3xl border-2 border-dashed border-slate-200 animate-fade-in">
                                {isFetching ? ( <> <div className="spinner !border-slate-200 !border-t-brand-500 mb-4 w-8 h-8"></div> <p className="text-slate-500 text-sm font-medium animate-pulse">Mengambil data dari cloud...</p> </> ) : ( <> <div className="p-6 bg-slate-50 rounded-full mb-6 shadow-inner"><Icons.Cloud className="w-10 h-10 text-slate-300" /></div> <h3 className="text-xl font-bold text-slate-800 mb-2">Belum ada data</h3> <p className="text-slate-500 text-sm mb-8 text-center max-w-xs leading-relaxed">Upload file laporan Excel/CSV Anda untuk melihat analitik dan performa Hub.</p> <div className="flex gap-2 text-[10px] font-mono text-slate-400 bg-slate-50 px-3 py-2 rounded-lg border border-slate-100"> <span>Required Columns:</span> <span className="font-bold text-slate-600">pickup_hub, delivery_hub, 80_dt</span> </div> </> )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
